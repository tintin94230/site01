<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Administration – Lieux</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid rgba(255,255,255,0.3);
      padding: 8px;
      text-align: left;
    }
    th {
      background: rgba(255,255,255,0.15);
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 6px;
      box-sizing: border-box;
      background: rgba(255,255,255,0.1);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px;
    }
    button {
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid rgba(79,195,247,0.4);
      background: rgba(79,195,247,0.25);
      color: white;
    }
    button:hover {
      background: rgba(79,195,247,0.4);
    }
    .form-ajout {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto auto;
      gap: 10px;
      margin-top: 20px;
    }
    .back-link {
      margin-top: 20px;
      display: inline-block;
      padding: 8px 16px;
      background: rgba(79,195,247,0.25);
      border-radius: 6px;
      border: 1px solid rgba(79,195,247,0.4);
      color: white;
      text-decoration: none;
    }
    .back-link:hover {
      background: rgba(79,195,247,0.4);
    }
  </style>
</head>

<body>
<div class="container">
  <header>
    <h1>Administration</h1>
    <p>Gestion des lieux (supabase002)</p>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Accueil</a></li>
      <li><a href="apropos.html">À propos</a></li>
      <li><a href="projets.html">Projets</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="admin.html">Espace Admin</a></li>
    </ul>
  </nav>

  <main>
    <a href="admin.html" class="back-link">← Retour à l’accueil Admin</a>

    <h2>Liste des lieux enregistrés</h2>

    <table id="table-supabase002">
      <thead>
        <tr>
          <th>Nom</th>
          <th>Latitude</th>
          <th>Longitude</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h3>Ajouter un nouveau lieu</h3>

    <div class="form-ajout">
      <input type="text" id="nouveau-nom" placeholder="Nom du lieu">
      <input type="number" step="any" id="nouvelle-latitude" placeholder="Latitude">
      <input type="number" step="any" id="nouvelle-longitude" placeholder="Longitude">
      <button onclick="rechercherCoordonnees()">RECHERCHE</button>
      <button onclick="ajouterLieu()">AJOUTER</button>
    </div>

  </main>

  <footer>© 2026 · Tintin94230</footer>
</div>

<script>
const tbody = document.querySelector('#table-supabase002 tbody');

function creerInput(type, value, field) {
  const input = document.createElement('input');
  input.type = type;
  input.step = type === 'number' ? 'any' : undefined;
  input.value = value ?? '';
  input.dataset.field = field;
  return input;
}

async function chargersupabase002() {
  tbody.innerHTML = '<tr><td colspan="4">⏳ Chargement...</td></tr>';
  try {
    const res = await fetch('/api/supabase002');
    if (!res.ok) throw new Error('Erreur API');
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error('Données invalides');

    tbody.innerHTML = '';
    data.forEach(lieu => {
      const tr = document.createElement('tr');
      const tdNom = document.createElement('td');
      tdNom.appendChild(creerInput('text', lieu.nom, 'nom'));
      const tdLat = document.createElement('td');
      tdLat.appendChild(creerInput('number', lieu.latitude, 'latitude'));
      const tdLon = document.createElement('td');
      tdLon.appendChild(creerInput('number', lieu.longitude, 'longitude'));
      const tdActions = document.createElement('td');
      const btnMod = document.createElement('button');
      btnMod.textContent = 'Modifier';
      btnMod.onclick = () => modifierLieu(lieu.id, tr, btnMod);
      const btnSup = document.createElement('button');
      btnSup.textContent = 'Supprimer';
      btnSup.onclick = () => supprimerLieu(lieu.id);
      tdActions.append(btnMod, btnSup);
      tr.append(tdNom, tdLat, tdLon, tdActions);
      tbody.appendChild(tr);
    });
  } catch (err) {
    console.error(err);
    tbody.innerHTML = '<tr><td colspan="4">❌ Erreur de chargement</td></tr>';
  }
}

async function rechercherCoordonnees() {
  const nom = document.getElementById('nouveau-nom').value.trim();
  const latInput = document.getElementById('nouvelle-latitude');
  const lonInput = document.getElementById('nouvelle-longitude');
  if (!nom) {
    alert('Veuillez saisir un nom de lieu');
    return;
  }
  latInput.value = '';
  lonInput.value = '';
  try {
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(nom)}`;
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('Erreur API géocodage');
    const data = await res.json();
    if (!Array.isArray(data) || data.length === 0) {
      alert('Lieu introuvable');
      return;
    }
    latInput.value = Number(data[0].lat).toFixed(6);
    lonInput.value = Number(data[0].lon).toFixed(6);
  } catch (err) {
    console.error(err);
    alert('Erreur lors de la recherche des coordonnées');
  }
}

async function ajouterLieu() {
  const nomInput = document.getElementById('nouveau-nom');
  const latInput = document.getElementById('nouvelle-latitude');
  const lonInput = document.getElementById('nouvelle-longitude');
  const nom = nomInput.value.trim();
  const latitude = Number(latInput.value);
  const longitude = Number(lonInput.value);
  if (!nom || isNaN(latitude) || isNaN(longitude)) {
    alert('Tous les champs sont obligatoires');
    return;
  }
  await fetch('/api/supabase002', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nom, latitude, longitude })
  });
  chargersupabase002();
  // vider le formulaire
  nomInput.value = '';
  latInput.value = '';
  lonInput.value = '';
  nomInput.focus();
}

async function modifierLieu(id, row, bouton) {
  const inputs = row.querySelectorAll('input');
  const data = { id };
  inputs.forEach(input => {
    data[input.dataset.field] =
      input.type === 'number' ? Number(input.value) : input.value.trim();
  });
  bouton.disabled = true;
  await fetch('/api/supabase002', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  bouton.disabled = false;
  chargersupabase002();
}

async function supprimerLieu(id) {
  if (!confirm('Supprimer ce lieu ?')) return;
  await fetch('/api/supabase002', {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  chargersupabase002();
}

document.addEventListener('DOMContentLoaded', chargersupabase002);
</script>
</body>
</html>
