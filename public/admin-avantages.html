<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Administration – Avantages</title>
<style>
body { background:#121212; color:#fff; font-family:Inter,sans-serif; margin:0; padding:0; }
.container { max-width:1600px; margin:auto; padding:20px; }
h1, h3 { color:#4fc3f7; margin-top:30px; }
table { width:100%; border-collapse:collapse; margin-top:15px; }
th, td { border:1px solid rgba(255,255,255,0.3); padding:6px; text-align:center; }
th { background: rgba(255,255,255,0.15); }
input, select, textarea { width:100%; padding:6px; border-radius:6px; border:1px solid rgba(255,255,255,0.3); background:#1e1e1e; color:#fff; }
textarea { resize:vertical; }
button { padding:5px 10px; border-radius:5px; border:1px solid rgba(79,195,247,0.4); background: rgba(79,195,247,0.25); color:#fff; cursor:pointer; }
button:hover { background: rgba(79,195,247,0.45); }
</style>
</head>
<body>

<div class="container">

<h1>Administration – Avantages</h1>

<label>Pays</label>
<select id="pays-select">
<option value="">-- Choisir un pays --</option>
</select>

<label>Transporteur</label>
<select id="transporteur-select">
<option value="">-- Choisir un transporteur --</option>
</select>

<h3>Création / modification</h3>
<table>
<thead>
<tr>
<th>Bénéficiaire</th>
<th>Nb coupons</th>
<th>%</th>
<th>2nde</th>
<th>1ère</th>
<th>Conditions</th>
<th>Notes</th>
<th>Début</th>
<th>Fin</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<h3>Avantages enregistrés</h3>
<table>
<thead>
<tr>
<th>Pays</th>
<th>Transporteur</th>
<th>Bénéficiaire</th>
<th>Coupons</th>
<th>%</th>
<th>2nde</th>
<th>1ère</th>
<th>Début</th>
<th>Fin</th>
<th>Notes</th>
</tr>
</thead>
<tbody id="tbody-liste"></tbody>
</table>

</div>

<script>
let paysList = [], transporteurs = [], beneficiaires = [];

const tbody = document.getElementById("tbody");
const tbodyListe = document.getElementById("tbody-liste");

/* ========================= LOADERS ========================= */

async function chargerPays(){
  const resp = await fetch("/api/supabasePays?simple=1&used=1");
  const json = await resp.json();
  paysList = json.data || [];

  const sel = document.getElementById("pays-select");
  sel.innerHTML = "<option value=''>-- Choisir un pays --</option>";

  paysList.forEach(p=>{
    const opt = document.createElement("option");
    opt.value = p.id;
    opt.textContent = p.code_iso;
    sel.appendChild(opt);
  });
}

async function chargerTransporteurs(pays_id){
  const sel = document.getElementById("transporteur-select");
  sel.innerHTML = "<option value=''>-- Choisir un transporteur --</option>";
  if(!pays_id) return;

  const resp = await fetch(`/api/supabaseTransporteurs?simple=1&pays_id=${pays_id}`);
  const json = await resp.json();
  transporteurs = json.data || [];

  transporteurs.forEach(t=>{
    const opt = document.createElement("option");
    opt.value = t.id;
    opt.textContent = t.nom;
    sel.appendChild(opt);
  });
}

async function chargerBeneficiaires(){
  const resp = await fetch("/api/supabaseBeneficiaires");
  const json = await resp.json();
  beneficiaires = json.data || [];
}

/* ========================= TABLE SAISIE ========================= */

function construireTable(){
  tbody.innerHTML = "";
  beneficiaires.forEach(b=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${b.code}</td>
      <td><input type="number"></td>
      <td><input type="number" step="0.01"></td>
      <td><input type="number" step="0.01"></td>
      <td><input type="number" step="0.01"></td>
      <td><textarea></textarea></td>
      <td><textarea></textarea></td>
      <td><input type="date"></td>
      <td><input type="date"></td>
      <td><button onclick="enregistrer(this, ${b.id})">Enregistrer</button></td>
    `;
    tbody.appendChild(tr);
  });
}

/* ========================= SAVE ========================= */

async function enregistrer(btn, beneficiaire_id){
  const tr = btn.closest("tr");
  const val = i => tr.children[i].querySelector("input,textarea").value;

  const avantage = {
    transporteur_id: document.getElementById("transporteur-select").value,
    pays_id: document.getElementById("pays-select").value,
    beneficiaire_id,
    nb_coupons_gratuits: val(1) || null,
    reduction_percent: val(2) || null,
    prix_forfaitaire_2nde: val(3) || null,
    prix_forfaitaire_1ere: val(4) || null,
    conditions: val(5) || null,
    notes: val(6) || null,
    date_debut: val(7) || null,
    date_fin: val(8) || null
  };

  if(!avantage.transporteur_id || !avantage.pays_id){
    alert("Veuillez sélectionner un pays et un transporteur !");
    return;
  }

  const saveResp = await fetch("/api/supabaseAvantages",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(avantage)
  });

  if(saveResp.ok){
    alert("Avantage enregistré / mis à jour !");
    chargerAvantagesListe();
  } else {
    const err = await saveResp.json();
    alert("Erreur: " + (err.error || saveResp.statusText));
  }
}

/* ========================= LISTE ========================= */

async function chargerAvantagesListe(){
  const pays_id = document.getElementById("pays-select").value;
  const transporteur_id = document.getElementById("transporteur-select").value;

  if(!pays_id || !transporteur_id){
    tbodyListe.innerHTML = "";
    return;
  }

  const resp = await fetch(`/api/supabaseAvantages?pays_id=${pays_id}&transporteur_id=${transporteur_id}`);
  const json = await resp.json();
  const data = json.data || [];

  tbodyListe.innerHTML = "";

  data.forEach(a=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${a.pays?.code_iso || ""}</td>
      <td>${a.transporteur?.nom || ""}</td>
      <td>${a.beneficiaire?.code || ""}</td>
      <td>${a.nb_coupons_gratuits ?? ""}</td>
      <td>${a.reduction_percent ?? ""}</td>
      <td>${a.prix_forfaitaire_2nde ?? ""}</td>
      <td>${a.prix_forfaitaire_1ere ?? ""}</td>
      <td>${a.date_debut ?? ""}</td>
      <td>${a.date_fin ?? ""}</td>
      <td>${a.notes ?? ""}</td>
    `;
    tbodyListe.appendChild(tr);
  });
}

/* ========================= EVENTS ========================= */

document.getElementById("pays-select").addEventListener("change", async (e)=>{
  await chargerTransporteurs(e.target.value);
  chargerAvantagesListe();
});

document.getElementById("transporteur-select").addEventListener("change", chargerAvantagesListe);

document.addEventListener("DOMContentLoaded", async ()=>{
  await chargerPays();
  await chargerBeneficiaires();
  construireTable();
});
</script>

</body>
</html>
