<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin Pays</title>

<style>
body{background:#121212;color:#fff;font-family:Inter;padding:20px}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #333;padding:6px}
th{cursor:pointer;background:#1e1e1e}
input,textarea{width:100%;background:#1e1e1e;color:white;border:1px solid #444}
textarea{resize:vertical}
button{background:#2a7bd6;border:none;color:white;padding:6px 10px;margin:3px;border-radius:4px;cursor:pointer}
.toast{position:fixed;bottom:20px;right:20px;background:#333;padding:10px;border-radius:6px}
.invalid{border:2px solid red}
</style>
</head>

<body>

<h2>Gestion des pays</h2>

<div>
🔍 <input id="search" placeholder="Recherche">
<button onclick="exportCSV()">Export CSV</button>
<input type="file" id="csvFile" hidden onchange="importCSV(this)">
<button onclick="csvFile.click()">Import CSV</button>
</div>

<table>
<thead>
<tr>
<th onclick="sortBy('nom')">Nom ⬍</th>
<th onclick="sortBy('code_iso')">ISO ⬍</th>
<th>Notes</th>
<th></th>
</tr>
</thead>
<tbody></tbody>
</table>

<h3>Ajouter</h3>
<input id="newNom" placeholder="Nom">
<input id="newCode" placeholder="ISO">
<textarea id="newNotes" placeholder="Notes"></textarea>
<button onclick="add()">Ajouter</button>

<div>
<button onclick="prev()">◀</button>
<span id="info"></span>
<button onclick="next()">▶</button>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script>
const tbody=document.querySelector('tbody');
const ISO=/^[A-Z]{2}$/;

let page=0,limit=20,search="",sort="nom",dir="asc";

function toast(msg){
  toastDiv.textContent=msg;
  toastDiv.style.display='block';
  setTimeout(()=>toastDiv.style.display='none',1500);
}

async function load(){
  const res=await fetch(`/api/supabasePays?page=${page}&limit=${limit}&search=${search}&sort=${sort}&dir=${dir}`);
  const json=await res.json();

  tbody.innerHTML='';

  json.data.forEach(p=>{
    const tr=document.createElement('tr');

    tr.innerHTML=`
      <td><input value="${p.nom}" data-field="nom"></td>
      <td><input value="${p.code_iso}" data-field="code_iso"></td>
      <td><textarea data-field="notes">${p.notes??''}</textarea></td>
      <td><button onclick="del(${p.id})">🗑️</button></td>
    `;

    tr.querySelectorAll('[data-field]').forEach(i=>{
      i.onchange=()=>autoSave(p.id,tr);
    });

    tbody.appendChild(tr);
  });

  info.textContent=`Page ${page+1}`;
}

async function autoSave(id,row){
  const inputs=row.querySelectorAll('[data-field]');
  const data={id};

  inputs.forEach(i=>data[i.dataset.field]=i.value);

  if(!ISO.test(data.code_iso)){
    row.querySelector('[data-field="code_iso"]').classList.add('invalid');
    toast('ISO invalide (2 lettres)');
    return;
  }

  await fetch('/api/supabasePays',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  toast('Sauvé');
}

async function add(){
  const data={nom:newNom.value,code_iso:newCode.value,notes:newNotes.value};

  if(!ISO.test(data.code_iso)){toast('ISO invalide');return;}

  await fetch('/api/supabasePays',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  newNom.value=newCode.value=newNotes.value='';
  load();
}

async function del(id){
  if(!confirm('Supprimer ?'))return;
  await fetch('/api/supabasePays',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
  load();
}

function searchInput(e){search=e.target.value;page=0;load();}
search.oninput=searchInput;

function next(){page++;load();}
function prev(){if(page>0)page--;load();}

function sortBy(col){
  if(sort===col) dir=dir==='asc'?'desc':'asc';
  else{sort=col;dir='asc';}
  load();
}

function exportCSV(){window.location='/api/supabasePays?exportCsv=1';}

function importCSV(input){
  const reader=new FileReader();
  reader.onload=async()=>{
    const rows=reader.result.split('\n').slice(1).filter(Boolean).map(l=>{
      const [nom,code,notes]=l.replaceAll('"','').split(',');
      return {nom,code_iso:code,notes};
    });

    await fetch('/api/supabasePays?importCsv=1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rows)});
    load();
  };
  reader.readAsText(input.files[0]);
}

load();
</script>

</body>
</html>
