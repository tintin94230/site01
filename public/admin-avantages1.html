<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Administration – Création Avantages</title>
<style>
body { background:#121212; color:#fff; font-family:Inter,sans-serif; margin:0; padding:0; }
.container { max-width:1400px; margin:auto; padding:20px; }
h1, h3 { color:#4fc3f7; margin-top:30px; }
table { width:100%; border-collapse:collapse; margin-top:15px; }
th, td { border:1px solid rgba(255,255,255,0.3); padding:6px; text-align:center; }
th { background: rgba(255,255,255,0.15); }
input, select, textarea { width:100%; padding:6px; border-radius:6px; border:1px solid rgba(255,255,255,0.3); background:#1e1e1e; color:#fff; }
textarea { resize:vertical; }
button { padding:5px 10px; border-radius:5px; border:1px solid rgba(79,195,247,0.4); background: rgba(79,195,247,0.25); color:#fff; cursor:pointer; }
button:hover { background: rgba(79,195,247,0.45); }
</style>
</head>
<body>

<div class="container">
<h1>Administration – Création / Modification</h1>

<label>Pays</label>
<select id="pays-select">
<option value="">-- Choisir un pays --</option>
</select>

<label>Transporteur</label>
<select id="transporteur-select">
<option value="">-- Choisir un transporteur --</option>
</select>

<h3>Avantages par bénéficiaire</h3>

<table>
<thead>
<tr>
<th>Bénéficiaire</th>
<th>Nb coupons</th>
<th>%</th>
<th>2nde</th>
<th>1ère</th>
<th>Conditions</th>
<th>Notes</th>
<th>Début</th>
<th>Fin</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<script>
let beneficiaires = [];
let transporteurs = [];

const tbody = document.getElementById("tbody");

async function chargerPays(){
  const resp = await fetch("/api/supabasePays?simple=1&used=1");
  const json = await resp.json();
  const sel = document.getElementById("pays-select");
  sel.innerHTML = "<option value=''>-- Choisir un pays --</option>";
  (json.data||[]).forEach(p=>{
    const opt = document.createElement("option");
    opt.value = p.id;
    opt.textContent = p.code_iso;
    sel.appendChild(opt);
  });
}

async function chargerTransporteurs(pays_id){
  const sel = document.getElementById("transporteur-select");
  sel.innerHTML = "<option value=''>-- Choisir un transporteur --</option>";
  if(!pays_id) return;

  const resp = await fetch(`/api/supabaseTransporteurs?simple=1&pays_id=${pays_id}`);
  const json = await resp.json();

  transporteurs = json.data || [];
  transporteurs.forEach(t=>{
    const opt = document.createElement("option");
    opt.value = t.id;
    opt.textContent = t.nom;
    sel.appendChild(opt);
  });
}

async function chargerBeneficiaires(){
  const resp = await fetch("/api/supabaseBeneficiaires");
  const json = await resp.json();
  beneficiaires = json.data || [];
}

function construireTable(){
  tbody.innerHTML = "";
  beneficiaires.forEach(b=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${b.code}</td>
      <td><input type="number"></td>
      <td><input type="number" step="0.01"></td>
      <td><input type="number" step="0.01"></td>
      <td><input type="number" step="0.01"></td>
      <td><textarea></textarea></td>
      <td><textarea></textarea></td>
      <td><input type="date" value="2026-01-01"></td>
      <td><input type="date" value="2099-12-31"></td>
      <td><button onclick="enregistrer(this, ${b.id})">Enregistrer</button></td>
    `;
    tbody.appendChild(tr);
  });
}

async function enregistrer(btn, beneficiaire_id){
  const tr = btn.closest("tr");
  const val = i => tr.children[i].querySelector("input,textarea").value;

  const payload = {
    transporteur_id: document.getElementById("transporteur-select").value,
    pays_id: document.getElementById("pays-select").value,
    beneficiaire_id,
    nb_coupons_gratuits: val(1)||null,
    reduction_percent: val(2)||null,
    prix_forfaitaire_2nde: val(3)||null,
    prix_forfaitaire_1ere: val(4)||null,
    conditions: val(5)||null,
    notes: val(6)||null,
    date_debut: val(7)||null,
    date_fin: val(8)||null
  };

  if(!payload.transporteur_id || !payload.pays_id){
    alert("Sélectionner pays + transporteur");
    return;
  }

  const resp = await fetch("/api/supabaseAvantages",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  });

  if(resp.ok){
    alert("Avantage enregistré !");
  } else {
    const err = await resp.json();
    alert(err.error || "Erreur");
  }
}

document.getElementById("pays-select").addEventListener("change", e=>{
  chargerTransporteurs(e.target.value);
});

document.addEventListener("DOMContentLoaded", async ()=>{
  await chargerPays();
  await chargerBeneficiaires();
  construireTable();
});
</script>

</body>
</html>
