<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Voyager en train</title>
<style>
body{background:#121212;color:#fff;font-family:Inter;padding:20px}
select{padding:6px;background:#1e1e1e;color:white;border:1px solid #444}
.section{margin-top:30px;padding:15px;background:#1a1a1a;border-radius:6px}
h2{color:#4fc3f7}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #333;padding:6px;text-align:left}
</style>
</head>
<body>

<h1>Voyager en train</h1>

<label>Pays :</label>
<select id="paysSelect">
<option value="">-- Choisir un pays --</option>
</select>

<div id="contenu"></div>

<script>
const select=document.getElementById("paysSelect");
const contenu=document.getElementById("contenu");

async function chargerPays(){
  const res=await fetch('/api/supabasePays?limit=500');
  const json=await res.json();
  json.data.forEach(p=>{
    const opt=document.createElement("option");
    opt.value=p.id;
    opt.textContent=`${p.nom} (${p.code_iso})`;
    select.appendChild(opt);
  });
}

select.addEventListener("change",()=>chargerInfos(select.value));

async function chargerInfos(id){
  if(!id){contenu.innerHTML="";return;}

  contenu.innerHTML="Chargement...";

  const [paysRes, infoRes, avantagesRes] = await Promise.all([
    fetch(`/api/supabasePays?id=${id}`),
    fetch(`/api/supabaseInfoPays?pays_id=${id}`),
    fetch(`/api/supabaseAvantages?pays_id=${id}`)
  ]);

  const pays=(await paysRes.json()).data?.[0];
  const infos=(await infoRes.json()).data||[];
  const avantages=(await avantagesRes.json()).data||[];

  let html="";

  /* ==== INFOS PAYS ==== */
  html+=`
  <div class="section">
    <h2>${pays.nom}</h2>
    <p><strong>Code ISO :</strong> ${pays.code_iso}</p>
    <p>${pays.notes||""}</p>
  </div>
  `;

  /* ==== INFO DETAILLEE ==== */
  if(infos.length){
    html+=`<div class="section"><h2>Informations pratiques</h2>`;
    infos.forEach(i=>{
      html+=`<p><strong>${i.titre||""}</strong><br>${i.contenu||""}</p>`;
    });
    html+=`</div>`;
  }

  /* ==== AVANTAGES ==== */
  if(avantages.length){
    html+=`
    <div class="section">
      <h2>Avantages</h2>
      <table>
        <thead>
          <tr>
            <th>Transporteur</th>
            <th>Bénéficiaire</th>
            <th>Réduction</th>
            <th>Coupons</th>
            <th>Validité</th>
          </tr>
        </thead>
        <tbody>
    `;

    avantages.forEach(a=>{
      html+=`
      <tr>
        <td>${a.transporteur?.nom||""}</td>
        <td>${a.beneficiaire?.libelle||""}</td>
        <td>${a.reduction_percent||""}%</td>
        <td>${a.nb_coupons_gratuits||""}</td>
        <td>${a.date_debut||""} → ${a.date_fin||""}</td>
      </tr>
      `;
    });

    html+=`</tbody></table></div>`;
  }

  contenu.innerHTML=html;
}

chargerPays();
</script>

</body>
</html>
