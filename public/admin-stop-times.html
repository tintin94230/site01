<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Administration Stop Times</title>
<style>
body { background:#121212; color:#fff; font-family:Inter,sans-serif; margin:0; padding:20px; }
h1 { color:#4fc3f7; }
table { width:100%; border-collapse: collapse; margin: 10px 0; }
th, td { border:1px solid rgba(255,255,255,0.3); padding:6px; text-align:left; }
th { background: rgba(255,255,255,0.15); }
button { margin:5px; padding:5px 10px; }
input[type="text"] { padding:4px; margin-right:10px; }
.pagination { margin:10px 0; display:flex; justify-content: space-between; align-items:center; }
</style>
</head>
<body>

<h1>Administration des Stop Times</h1>

<div>
  <label for="search-stop-times">Rechercher Trip ID / Stop ID : </label>
  <input type="text" id="search-stop-times" placeholder="Ex : T123 ou S456">
  <button id="btn-search">Rechercher</button>
  <span id="total-count" style="margin-left:20px;"></span>
</div>

<div class="pagination" id="pagination-top">
  <button id="prev-page">Précédente</button>
  <span id="page-info">Page 1</span>
  <button id="next-page">Suivante</button>
</div>

<table id="table-stop-times">
<thead>
<tr>
  <th>trip_id</th>
  <th>arrival_time</th>
  <th>departure_time</th>
  <th>stop_id</th>
  <th>stop_sequence</th>
  <th>stop_headsign</th>
  <th>pickup_type</th>
  <th>drop_off_type</th>
  <th>shape_dist_traveled</th>
</tr>
</thead>
<tbody>
<tr><td colspan="9">Chargement...</td></tr>
</tbody>
</table>

<div class="pagination" id="pagination-bottom">
  <button id="prev-page-b">Précédente</button>
  <span id="page-info-b">Page 1</span>
  <button id="next-page-b">Suivante</button>
</div>

<script>
const tableBody = document.querySelector("#table-stop-times tbody");
const searchInput = document.getElementById("search-stop-times");
const btnSearch = document.getElementById("btn-search");
const pageInfo = document.getElementById("page-info");
const pageInfoB = document.getElementById("page-info-b");
const prevPageBtns = [document.getElementById("prev-page"), document.getElementById("prev-page-b")];
const nextPageBtns = [document.getElementById("next-page"), document.getElementById("next-page-b")];
const totalCountSpan = document.getElementById("total-count");

let currentPage = 1;
const pageSize = 100;
let totalRows = 0;
let currentSearch = "";

// ---------------- Fonction pour charger les stop_times ----------------
async function loadStopTimes(page = 1, search = "") {
  currentPage = page;
  currentSearch = search;

  let query = `/api/supabaseStopTimes?sort=trip_id&dir=asc&limit=${pageSize}&offset=${(page-1)*pageSize}`;
  if(search) query += `&search=${encodeURIComponent(search)}`;

  const res = await fetch(query);
  const json = await res.json();
  const data = json.data || [];
  totalRows = json.total || 0;

  tableBody.innerHTML = "";
  if(data.length===0){
    tableBody.innerHTML = `<tr><td colspan="9">Aucune ligne trouvée</td></tr>`;
  } else {
    data.forEach(st => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${st.trip_id}</td>
        <td>${st.arrival_time ?? ""}</td>
        <td>${st.departure_time ?? ""}</td>
        <td>${st.stop_id}</td>
        <td>${st.stop_sequence ?? ""}</td>
        <td>${st.stop_headsign ?? ""}</td>
        <td>${st.pickup_type ?? ""}</td>
        <td>${st.drop_off_type ?? ""}</td>
        <td>${st.shape_dist_traveled ?? ""}</td>
      `;
      tableBody.appendChild(tr);
    });
  }

  const totalPages = Math.ceil(totalRows / pageSize) || 1;
  pageInfo.textContent = `Page ${currentPage} / ${totalPages}`;
  pageInfoB.textContent = `Page ${currentPage} / ${totalPages}`;
  totalCountSpan.textContent = `Total lignes : ${totalRows}`;

  prevPageBtns.forEach(btn => btn.disabled = currentPage <= 1);
  nextPageBtns.forEach(btn => btn.disabled = currentPage >= totalPages);
}

// ---------------- Pagination ----------------
prevPageBtns.forEach(btn => btn.addEventListener("click", ()=>loadStopTimes(currentPage-1, currentSearch)));
nextPageBtns.forEach(btn => btn.addEventListener("click", ()=>loadStopTimes(currentPage+1, currentSearch)));

// ---------------- Recherche ----------------
btnSearch.addEventListener("click", ()=>{
  const val = searchInput.value.trim().toLowerCase();
  if(val.length >= 2){ 
    loadStopTimes(1, val); 
  } else {
    alert("Tapez au moins 2 lettres pour rechercher");
  }
});

// ---------------- Init ----------------
document.addEventListener("DOMContentLoaded", ()=>loadStopTimes());
</script>

</body>
</html>
