<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Administration – Infos Pays</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
<h1>Administration – Infos Pays</h1>

<label>Pays</label>
<select id="pays-select">
  <option value="">-- Choisir un pays --</option>
</select>

<h3>Saisie par catégorie</h3>
<table>
<thead>
<tr>
<th>Catégorie</th>
<th>Texte</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<h3>Import / Export CSV</h3>
<input type="file" id="csv-file" accept=".csv">
<button onclick="importCSV()">Importer CSV</button>
<button onclick="exportCSV()">Exporter CSV</button>

<h3>Infos déjà enregistrées</h3>
<input type="text" id="filter" placeholder="Filtrer par pays ou catégorie">
<div id="cards-container"></div>
</div>

<script>
let paysList = [];
onst categories = ["VOYAGER_DEPUIS","VOYAGER_EN","ACHAT_FIP","PRESENTATION","FRONTIERES","COMPAGNIES_FIP","TOURISTIQUES","CONSEILS"];
const tbody = document.getElementById("tbody");
const cardsContainer = document.getElementById("cards-container");

// NORMALISATION pour code_iso (accents, espaces)
const normalize = str => str?.normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();

// Charger la liste des pays
async function chargerPays(){
  const resp = await fetch("/api/supabasePays?simple=1");
  const json = await resp.json();
  paysList = json.data || [];
  const sel = document.getElementById("pays-select");
  sel.innerHTML = "<option value=''>-- Choisir un pays --</option>";
  paysList.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p.id;
    opt.textContent = p.code_iso;
    sel.appendChild(opt);
  });
}

// Construire la table de saisie dynamiquement
function construireTable() {
  tbody.innerHTML = "";
  categories.forEach(cat => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${cat}</td>
      <td><textarea></textarea></td>
      <td><button onclick="enregistrer(this,'${cat}')">Enregistrer</button></td>
    `;
    tbody.appendChild(tr);
  });
}

// Enregistrer / mettre à jour
async function enregistrer(btn, categorie){
  const pays_id = document.getElementById("pays-select").value;
  if(!pays_id) { alert("Veuillez sélectionner un pays"); return; }
  const tr = btn.closest("tr");
  const texte = tr.querySelector("textarea").value;
  const resp = await fetch("/api/supabaseInfoPays",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ pays_id, categorie, texte })
  });
  const json = await resp.json();
  if(json.success) chargerListe();
  else alert("Erreur: " + (json.error || "Erreur inconnue"));
}

// Charger la liste déjà saisie et afficher en cartes
async function chargerListe(){
  const resp = await fetch("/api/supabaseInfoPays");
  const json = await resp.json();
  const data = json.data || [];
  afficherCartes(data);
}

// Affichage des cartes
function afficherCartes(data){
  const filterVal = document.getElementById("filter")?.value.toLowerCase() || "";
  cardsContainer.innerHTML = "";
  data.forEach(a=>{
    const pays = paysList.find(p=>p.id==a.pays_id)?.code_iso || "";
    const textSearch = (pays + a.categorie + a.texte).toLowerCase();
    if(filterVal && !textSearch.includes(filterVal)) return; // filtrage

    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <strong>${pays} - ${a.categorie}</strong>
      <p>${a.texte || ""}</p>
      <small>${a.date_update ? new Date(a.date_update).toLocaleString() : ""}</small>
      <button onclick="supprimer(${a.id})">Supprimer</button>
    `;
    cardsContainer.appendChild(div);
  });
}

// Supprimer
async function supprimer(id){
  if(!confirm("Confirmer la suppression ?")) return;
  const resp = await fetch("/api/supabaseInfoPays",{
    method:"DELETE",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ id })
  });
  const json = await resp.json();
  if(json.success) chargerListe();
  else alert("Erreur: " + (json.error || "Erreur inconnue"));
}

// IMPORT CSV robuste
async function importCSV(){
  const fileInput = document.getElementById("csv-file");
  if(!fileInput.files.length) return alert("Choisir un fichier CSV");

  const text = await fileInput.files[0].text();
  const rows = text.split(/\r?\n/).filter(l => l.trim());
  
  const parseCSVLine = line => {
    const regex = /(?:\"([^\"]*(?:\"\"[^\"]*)*)\"|([^,]+))/g;
    const result = [];
    let match;
    while((match = regex.exec(line)) !== null){
      result.push(match[1] ? match[1].replace(/""/g,'"') : match[2]);
    }
    return result;
  }

  for(const line of rows){
    const parts = parseCSVLine(line);
    if(parts.length < 3) continue;
    const code_iso = parts[0].trim();
    const categorie = parts[1].trim();
    const texte = parts.slice(2).join(",").trim();

    if(!categories.includes(categorie)) { console.warn("Catégorie inconnue :", categorie); continue; }

    const pays = paysList.find(p => normalize(p.code_iso) === normalize(code_iso));
    if(!pays){ console.warn("Pays non trouvé :", code_iso); continue; }

    try{
      const resp = await fetch("/api/supabaseInfoPays",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ pays_id:pays.id, categorie, texte })
      });
      const json = await resp.json();
      if(!json.success) console.error("Erreur API:", json.error, { code_iso, categorie });
    } catch(err){
      console.error("Erreur fetch:", err, { code_iso, categorie });
    }
  }

  await chargerListe();
  alert("Import terminé !");
}

// EXPORT CSV
function exportCSV(){
  let csv = "code_iso,categorie,texte\n";
  const cards = cardsContainer.querySelectorAll(".card");
  cards.forEach(div=>{
    const [strong, p] = div.querySelectorAll("strong, p");
    const [code_iso, categorie] = strong.textContent.split(" - ");
    const texte = p.textContent.replace(/"/g,'""');
    csv += `${code_iso},${categorie},"${texte}"\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "infos_pays.csv";
  a.click();
  URL.revokeObjectURL(url);
}

// Filtre dynamique
document.getElementById("filter").addEventListener("input", chargerListe);

document.addEventListener("DOMContentLoaded", async ()=>{
  await chargerPays();
  construireTable();
  chargerListe();
});
</script>
</body>
</html>
