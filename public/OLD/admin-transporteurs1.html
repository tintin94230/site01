<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Administration – Transporteurs</title>
<style>
body{background:#121212;color:#fff;font-family:Inter;padding:20px}
input,select,textarea,button{padding:6px;border-radius:6px;border:1px solid rgba(255,255,255,0.25);background:#1e1e1e;color:white}
button{cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid rgba(255,255,255,0.15);padding:6px}
textarea{resize:vertical;width:200px}
.selectPays{margin-bottom:4px}
.actions{white-space:nowrap}
</style>
</head>
<body>

<h1>Administration – Transporteurs</h1>

<table>
<thead>
<tr>
<th>Nom</th>
<th>Type</th>
<th>Site web</th>
<th>Pays</th>
<th>Notes</th>
<th class="actions">Actions</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<h3>Ajouter / modifier transporteur</h3>
<div>
<input id="new-nom" placeholder="Nom">
<input id="new-type" placeholder="Type">
<input id="new-site" placeholder="https://site.com">
<div id="pays-container"></div>
<button onclick="addPaysSelect()">+ Ajouter un pays</button>
<textarea id="new-notes" placeholder="Notes"></textarea>
<button onclick="addTransporteur()">Ajouter transporteur</button>
</div>

<script>
const tbody = document.getElementById("tbody");
const newNom = document.getElementById("new-nom");
const newType = document.getElementById("new-type");
const newSite = document.getElementById("new-site");
const newNotes = document.getElementById("new-notes");
const paysContainer = document.getElementById("pays-container");

let paysList = [];

// Charger tous les pays
async function loadPays(){
  const r = await fetch("/api/supabasePays?limit=1000");
  const j = await r.json();
  paysList = j.data || [];
  addPaysSelect(); // ajoute au moins un select
}

// Ajouter un select de pays
function addPaysSelect(selectedId){
  const div = document.createElement("div");
  div.className = "selectPays";
  const select = document.createElement("select");
  paysList.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p.id;
    opt.textContent = `${p.code_iso} – ${p.nom}`;
    if(p.id===selectedId) opt.selected=true;
    select.appendChild(opt);
  });
  const btn = document.createElement("button");
  btn.textContent = "X";
  btn.type = "button";
  btn.onclick = ()=>{div.remove();}
  div.appendChild(select); div.appendChild(btn);
  paysContainer.appendChild(div);
}

// Ajouter transporteur
async function addTransporteur(){
  const nom = newNom.value.trim();
  const type = newType.value.trim();
  const site = newSite.value.trim();
  const notes = newNotes.value.trim();
  const pays = Array.from(paysContainer.querySelectorAll("select")).map(s=>parseInt(s.value,10));
  if(!nom || pays.length===0) return alert("Nom et au moins un pays obligatoires");
  const res = await fetch("/api/supabaseTransporteurs",{method:"POST",headers:{'Content-Type':'application/json'},body:JSON.stringify({nom,type,site_web:site,notes,pays})});
  if(!res.ok) return alert("Erreur ajout");
  newNom.value=""; newType.value=""; newSite.value=""; newNotes.value=""; paysContainer.innerHTML=""; addPaysSelect();
  loadTransporteurs();
}

// Charger transporteurs
async function loadTransporteurs(){
  const r = await fetch("/api/supabaseTransporteurs?limit=50");
  const j = await r.json();
  tbody.innerHTML="";
  j.data.forEach(t=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
<td>${t.nom}</td>
<td>${t.type||''}</td>
<td>${t.site_web||''}</td>
<td>${t.transporteurs_pays.map(tp=>tp.pays.code_iso).join("; ")}</td>
<td>${t.notes||''}</td>
<td class="actions"><button onclick="remove(${t.id})">🗑</button></td>
`;
    tbody.appendChild(tr);
  });
}

// Supprimer transporteur
async function remove(id){
  if(!confirm("Supprimer ?")) return;
  await fetch("/api/supabaseTransporteurs",{method:"DELETE",headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
  loadTransporteurs();
}

// Init
document.addEventListener("DOMContentLoaded", async ()=>{
  await loadPays();
  await loadTransporteurs();
});
</script>

</body>
</html>
