<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Administration – Infos Pays</title>
<style>
body { background:#121212; color:#fff; font-family:Inter,sans-serif; margin:0; padding:0; }
.container { max-width:1600px; margin:auto; padding:20px; }
h1,h3 { color:#4fc3f7; margin-top:20px; }
table { width:100%; border-collapse:collapse; margin-top:15px; }
th, td { border:1px solid rgba(255,255,255,0.3); padding:6px; text-align:center; }
th { background: rgba(255,255,255,0.15); }
select, textarea, input[type=file] { width:100%; padding:6px; border-radius:6px; border:1px solid rgba(255,255,255,0.3); background:#1e1e1e; color:#fff; }
textarea { resize:vertical; }
button { padding:5px 10px; border-radius:5px; border:1px solid rgba(79,195,247,0.4); background: rgba(79,195,247,0.25); color:#fff; cursor:pointer; }
button:hover { background: rgba(79,195,247,0.45); }
</style>
</head>
<body>
<div class="container">
<h1>Administration – Infos Pays</h1>

<label>Pays</label>
<select id="pays-select">
  <option value="">-- Choisir un pays --</option>
</select>

<h3>Saisie par catégorie</h3>
<table>
<thead>
<tr>
<th>Catégorie</th>
<th>Texte</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<h3>Import / Export CSV</h3>
<input type="file" id="csv-file" accept=".csv">
<button onclick="importCSV()">Importer CSV</button>
<button onclick="exportCSV()">Exporter CSV</button>

<h3>Infos déjà enregistrées</h3>
<table>
<thead>
<tr>
<th>ID</th>
<th>Pays</th>
<th>Catégorie</th>
<th>Texte</th>
<th>Date mise à jour</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tbody-liste"></tbody>
</table>
</div>

<script>
let paysList = [];
const categories = ["Y ALLER","SUR PLACE","ACHAT"];
const tbody = document.getElementById("tbody");
const tbodyListe = document.getElementById("tbody-liste");

// NORMALISATION pour code_iso (accents, espaces)
const normalize = str => str?.normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();

// Charger la liste des pays
async function chargerPays(){
  const resp = await fetch("/api/supabasePays?simple=1");
  const json = await resp.json();
  paysList = json.data || [];
  const sel = document.getElementById("pays-select");
  sel.innerHTML = "<option value=''>-- Choisir un pays --</option>";
  paysList.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p.id;
    opt.textContent = p.code_iso;
    sel.appendChild(opt);
  });
}

// Construire la table de saisie
function construireTable() {
  tbody.innerHTML = "";
  categories.forEach(cat => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${cat}</td>
      <td><textarea></textarea></td>
      <td><button onclick="enregistrer(this,'${cat}')">Enregistrer</button></td>
    `;
    tbody.appendChild(tr);
  });
}

// Enregistrer / mettre à jour
async function enregistrer(btn, categorie){
  const pays_id = document.getElementById("pays-select").value;
  if(!pays_id) { alert("Veuillez sélectionner un pays"); return; }
  const tr = btn.closest("tr");
  const texte = tr.querySelector("textarea").value;
  const resp = await fetch("/api/supabaseInfoPays",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ pays_id, categorie, texte })
  });
  const json = await resp.json();
  if(json.success) chargerListe();
  else alert("Erreur: " + (json.error || "Erreur inconnue"));
}

// Charger la liste déjà saisie
async function chargerListe(){
  const resp = await fetch("/api/supabaseInfoPays");
  const json = await resp.json();
  const data = json.data || [];
  tbodyListe.innerHTML = "";
  data.forEach(a=>{
    const pays = paysList.find(p=>p.id==a.pays_id)?.code_iso || "";
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${a.id}</td>
      <td>${pays}</td>
      <td>${a.categorie}</td>
      <td>${a.texte || ""}</td>
      <td>${a.date_update ? new Date(a.date_update).toLocaleString() : ""}</td>
      <td><button onclick="supprimer(${a.id})">Supprimer</button></td>
    `;
    tbodyListe.appendChild(tr);
  });
}

// Supprimer
async function supprimer(id){
  if(!confirm("Confirmer la suppression ?")) return;
  const resp = await fetch("/api/supabaseInfoPays",{
    method:"DELETE",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ id })
  });
  const json = await resp.json();
  if(json.success) chargerListe();
  else alert("Erreur: " + (json.error || "Erreur inconnue"));
}

// IMPORT CSV robuste avec parsing correct
async function importCSV(){
  const fileInput = document.getElementById("csv-file");
  if(!fileInput.files.length) return alert("Choisir un fichier CSV");

  const text = await fileInput.files[0].text();
  const rows = text.split(/\r?\n/).filter(l => l.trim());
  
  // parser CSV simple mais gère les guillemets et virgules
  const parseCSVLine = line => {
    const regex = /(?:\"([^\"]*(?:\"\"[^\"]*)*)\"|([^,]+))/g;
    const result = [];
    let match;
    while((match = regex.exec(line)) !== null){
      result.push(match[1] ? match[1].replace(/""/g,'"') : match[2]);
    }
    return result;
  }

  for(const line of rows){
    const parts = parseCSVLine(line);
    if(parts.length < 3) continue;
    const code_iso = parts[0].trim();
    const categorie = parts[1].trim();
    const texte = parts.slice(2).join(",").trim();

    if(!categories.includes(categorie)) {
      console.warn("Catégorie inconnue :", categorie);
      continue;
    }

    const pays = paysList.find(p => normalize(p.code_iso) === normalize(code_iso));
    if(!pays){
      console.warn("Pays non trouvé :", code_iso);
      continue;
    }

    try{
      const resp = await fetch("/api/supabaseInfoPays",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ pays_id:pays.id, categorie, texte })
      });
      const json = await resp.json();
      if(!json.success) console.error("Erreur API:", json.error, { code_iso, categorie });
    } catch(err){
      console.error("Erreur fetch:", err, { code_iso, categorie });
    }
  }

  await chargerListe();
  alert("Import terminé !");
}


// EXPORT CSV
function exportCSV(){
  let csv = "code_iso,categorie,texte\n";
  const rows = tbodyListe.querySelectorAll("tr");
  rows.forEach(tr=>{
    const cols = tr.querySelectorAll("td");
    csv += `${cols[1].textContent},${cols[2].textContent},"${cols[3].textContent.replace(/"/g,'""')}"\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "infos_pays.csv";
  a.click();
  URL.revokeObjectURL(url);
}

document.addEventListener("DOMContentLoaded", async ()=>{
  await chargerPays();
  construireTable();
  chargerListe();
});
</script>
</body>
</html>
