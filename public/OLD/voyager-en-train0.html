<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Voyager en train</title>
<style>
body { background:#121212; color:#fff; font-family:Inter,sans-serif; margin:0; padding:20px; }
h1,h2,h3 { color:#4fc3f7; }
select,table { width:100%; margin:10px 0; }
table { border-collapse:collapse; }
th,td { border:1px solid rgba(255,255,255,0.3); padding:6px; text-align:left; }
th { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>

<h1>Voyager en train</h1>

<label for="pays">Choisir un pays :</label>
<select id="pays" disabled>
  <option value="">-- Chargement... --</option>
</select>

<h2>Infos du pays</h2>
<p>Nom : <span id="nomPays">---</span></p>
<p>Code ISO : <span id="codeISO">---</span></p>

<h2>Avantages FIP</h2>
<table id="table-avantages">
<thead>
<tr>
<th>ID</th>
<th>Transporteur</th>
<th>Bénéficiaire</th>
<th>Coupons</th>
<th>%</th>
<th>2nde</th>
<th>1ère</th>
<th>Début</th>
<th>Fin</th>
<th>Notes</th>
</tr>
</thead>
<tbody>
<tr><td colspan="10">Aucun avantage pour ce pays.</td></tr>
</tbody>
</table>

<h2>Infos détaillées</h2>
<table id="table-info">
<thead>
<tr>
<th>Catégorie</th>
<th>Texte</th>
</tr>
</thead>
<tbody>
<tr><td colspan="2">Aucune info détaillée pour ce pays.</td></tr>
</tbody>
</table>

<script>
let paysList = [];
let beneficiaires = {};
let transporteurs = {};

const selectPays = document.getElementById("pays");
const spanNom = document.getElementById("nomPays");
const spanCode = document.getElementById("codeISO");
const tableAvantages = document.getElementById("table-avantages").querySelector("tbody");
const tableInfo = document.getElementById("table-info").querySelector("tbody");

async function init() {
  try {
    // 1. Tous les pays
    const resPays = await fetch("/api/supabasePays?simple=1");
    const jsonPays = await resPays.json();
    paysList = jsonPays.data || [];

    // 2. Tous les bénéficiaires
    const resBen = await fetch("/api/supabaseBeneficiaires");
    const jsonBen = await resBen.json();
    (jsonBen.data || []).forEach(b => beneficiaires[String(b.id)] = b.libelle);

    // 3. Tous les transporteurs
    const resTransp = await fetch("/api/supabaseTransporteurs");
    const jsonTransp = await resTransp.json();
    (jsonTransp.data || []).forEach(t => transporteurs[String(t.id)] = t.nom);

    // Remplissage du select après que tout soit chargé
    selectPays.innerHTML = "<option value=''>-- Sélectionner --</option>";
    paysList.forEach(p => {
      const opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = `${p.nom} (${p.code_iso})`;
      opt.dataset.nom = p.nom;
      opt.dataset.code = p.code_iso;
      selectPays.appendChild(opt);
    });

    selectPays.disabled = false; // activation du select
  } catch (err) {
    console.error("Erreur init :", err);
  }
}

function resetDisplay() {
  spanNom.textContent = "-";
  spanCode.textContent = "-";
  tableAvantages.innerHTML = "<tr><td colspan='10'>Aucun avantage pour ce pays.</td></tr>";
  tableInfo.innerHTML = "<tr><td colspan='2'>Aucune info détaillée pour ce pays.</td></tr>";
}

async function afficherPays(id) {
  if (!id) return resetDisplay();

  const pays = paysList.find(p => p.id == id);
  spanNom.textContent = pays?.nom ?? "-";
  spanCode.textContent = pays?.code_iso ?? "-";

  // Avantages
  const resAv = await fetch(`/api/supabaseAvantages?pays_id=${id}`);
  const jsonAv = await resAv.json();
  const dataAv = jsonAv.data || [];
  tableAvantages.innerHTML = "";
  if (dataAv.length === 0) {
    tableAvantages.innerHTML = "<tr><td colspan='10'>Aucun avantage pour ce pays.</td></tr>";
  } else {
    dataAv.forEach(a => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${a.id}</td>
        <td>${transporteurs[String(a.transporteur_id)] || "?"}</td>
        <td>${beneficiaires[String(a.beneficiaire_id)] || "?"}</td>
        <td>${a.nb_coupons_gratuits ?? ""}</td>
        <td>${a.reduction_percent ?? ""}</td>
        <td>${a.prix_forfaitaire_2nde ?? ""}</td>
        <td>${a.prix_forfaitaire_1ere ?? ""}</td>
        <td>${a.date_debut ?? ""}</td>
        <td>${a.date_fin ?? ""}</td>
        <td>${a.notes ?? ""}</td>
      `;
      tableAvantages.appendChild(tr);
    });
  }

  // Infos détaillées
  const resInfo = await fetch(`/api/supabaseInfoPays?pays_id=${id}`);
  const jsonInfo = await resInfo.json();
  const dataInfo = jsonInfo.data || [];
  tableInfo.innerHTML = "";
  if (dataInfo.length === 0) {
    tableInfo.innerHTML = "<tr><td colspan='2'>Aucune info détaillée pour ce pays.</td></tr>";
  } else {
    dataInfo.forEach(info => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${info.categorie}</td><td>${info.texte ?? ""}</td>`;
      tableInfo.appendChild(tr);
    });
  }
}

// Gestion du changement de pays
selectPays.addEventListener("change", e => afficherPays(e.target.value));

document.addEventListener("DOMContentLoaded", init);
</script>

</body>
</html>
