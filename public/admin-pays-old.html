<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Administration – Pays</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  body { background:#121212; font-family:Inter, sans-serif; color:#fff; }
  .container { max-width: 800px; margin:auto; padding:20px; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { border: 1px solid rgba(255,255,255,0.3); padding: 8px; text-align: left; }
  th { background: rgba(255,255,255,0.15); }
  input[type="text"] { width:100%; padding:6px; border-radius:6px; border:1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color:#fff; }
  button { padding:6px 12px; border-radius:6px; border:1px solid rgba(79,195,247,0.4); background: rgba(79,195,247,0.25); color:#fff; cursor:pointer; margin-right:5px; }
  button:hover { background: rgba(79,195,247,0.4); }
  .form-ajout { display:grid; grid-template-columns:2fr 1fr auto auto; gap:10px; margin-top:20px; }
  .back-link { margin-top:20px; display:inline-block; padding:8px 16px; background: rgba(79,195,247,0.25); border-radius:6px; border:1px solid rgba(79,195,247,0.4); color:white; text-decoration:none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Administration</h1>
    <p>Gestion des pays</p>
  </header>

  <a href="admin.html" class="back-link">← Retour à l’accueil Admin</a>

  <h2>Liste des pays enregistrés</h2>
  <table id="table-pays">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Code ISO</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <button onclick="prevPage()">← Page précédente</button>
  <button onclick="nextPage()">Page suivante →</button>
  <button onclick="exportCSV()">📥 Export CSV</button>

  <h3>Ajouter un nouveau pays</h3>
  <div class="form-ajout">
    <input type="text" id="nouveau-nom" placeholder="Nom du pays">
    <input type="text" id="nouveau-code" placeholder="Code ISO">
    <button onclick="ajouterPays()">AJOUTER</button>
  </div>

  <div id="import-status"></div>
</div>

<script src="supabasePays.js"></script>
</body>
</html>
