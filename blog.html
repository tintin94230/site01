  <h1>Tester mon API</h1>

  <input type="text" id="mot" placeholder="Entrez un mot" />
  <button onclick="calculer()">Calculer</button>

  <p id="resultat"></p>

  <script>
async function calculer() {
  const mot = document.getElementById("mot").value;
  const response = await fetch(`http://localhost:3002/api/longueur?mot=${encodeURIComponent(mot)}`);
  const data = await response.json();
  document.getElementById("resultat").textContent =
    `Le mot "${data.mot}" contient ${data.longueur} lettres`;
}

  </script>
