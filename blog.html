<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>La Page de Test de Tintin94230</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="container">

    <header>
      <h1>Blog</h1>
      <p>Qui suis-je ?</p>
    </header>

    <nav>
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="apropos.html">À propos</a></li>
        <li><a href="projets.html">Projets</a></li>
        <li><a href="blog.html" class="active">Blog</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="admin.html">Espace Admin</a></li>
      </ul>
    </nav>

    <main>
      <p>Bienvenue sur la page de blog 🚀</p>

      <h2>Ajouter un mot</h2>

      <form id="formMot">
        <input type="text" id="mot" placeholder="Entrez un mot" required />
        <button type="submit">Ajouter</button>
      </form>

      <h2>Mots enregistrés</h2>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Mot</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="tableMots"></tbody>
      </table>
    </main>

    <footer>© 2026 · Tintin94230</footer>

  </div>

  <script>
    const table = document.getElementById("tableMots");
    const form = document.getElementById("formMot");
    const input = document.getElementById("mot");

    // Charger les mots existants
    async function chargerMots() {
      const response = await fetch("/api/supabase001");
      const mots = await response.json();

      table.innerHTML = "";

      mots.forEach(m => {
        table.innerHTML += `
          <tr>
            <td>${m.id}</td>
            <td>${m.mot}</td>
            <td>${new Date(m.created_at).toLocaleString()}</td>
          </tr>
        `;
      });
    }

    // Ajouter un mot
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const mot = input.value.trim();
      if (!mot) return;

      await fetch("/api/supabase001", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mot })
      });

      input.value = "";
      chargerMots();
    });

    // Chargement initial
    chargerMots();
  </script>

</body>
</html>
