<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>La Page de Test de Tintin94230 – Blog</title>

  <!-- Styles globaux -->
  <link rel="stylesheet" href="style.css">

  <!-- Police moderne -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="container">

    <!-- ================= HEADER ================= -->
    <header>
      <h1>Blog</h1>
      <p>Test API + Supabase</p>
    </header>

    <!-- ================= NAVIGATION ================= -->
    <nav>
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="apropos.html">À propos</a></li>
        <li><a href="projets.html">Projets</a></li>
        <li><a href="blog.html" class="active">Blog</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="admin.html">Espace Admin</a></li>
      </ul>
    </nav>

    <!-- ================= CONTENU ================= -->
    <main>

      <p>Bienvenue sur la page de blog 🚀</p>

      <!-- ===== FORMULAIRE ===== -->
      <h2>Ajouter un mot</h2>

      <form id="formMot">
        <input
          type="text"
          id="mot"
          placeholder="Entrez un mot"
          required
        />
        <button type="submit">Ajouter</button>
      </form>

      <!-- ===== TABLE ===== -->
      <h2>Mots enregistrés</h2>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Mot</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="tableMots">
          <!-- contenu injecté par JS -->
        </tbody>
      </table>

    </main>

    <!-- ================= FOOTER ================= -->
    <footer>© 2026 · Tintin94230</footer>

  </div>

  <!-- ================= SCRIPT ================= -->
  <script>
    // Références DOM (UNE FOIS, AU DÉBUT)
    const tableBody = document.getElementById("tableMots");
    const form = document.getElementById("formMot");
    const input = document.getElementById("mot");

    /* =============================
       Charger les mots (GET)
       ============================= */

async function chargerMots() {
  const tableBody = document.getElementById("tableMots");

  tableBody.innerHTML = `
    <tr>
      <td colspan="3">Chargement...</td>
    </tr>
  `;

  try {
    const response = await fetch("/api/supabase001");
    const result = await response.json();

    console.log("📦 Réponse API PROD :", result);

    tableBody.innerHTML = "";

    // ✅ CAS ERREUR API
    if (!Array.isArray(result)) {
      tableBody.innerHTML = `
        <tr>
          <td colspan="3" style="color:red;">
            Erreur API : ${JSON.stringify(result)}
          </td>
        </tr>
      `;
      return;
    }

    // ✅ CAS TABLE VIDE
    if (result.length === 0) {
      tableBody.innerHTML = `
        <tr>
          <td colspan="3">Aucun mot enregistré</td>
        </tr>
      `;
      return;
    }

    // ✅ CAS NORMAL
    result.forEach(item => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${item.id}</td>
        <td>${item.mot}</td>
        <td>${new Date(item.created_at).toLocaleString("fr-FR")}</td>
      `;
      tableBody.appendChild(tr);
    });

  } catch (error) {
    console.error("❌ Erreur chargement mots :", error);
    tableBody.innerHTML = `
      <tr>
        <td colspan="3" style="color:red;">
          Erreur réseau ou serveur
        </td>
      </tr>
    `;
  }
}





    /* =============================
       Ajouter un mot (POST)
       ============================= */
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const mot = input.value.trim();
      if (!mot) return;

      try {
        const response = await fetch("/api/supabase001", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mot })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error || "Erreur API");
        }

        input.value = "";
        chargerMots(); // rafraîchissement

      } catch (error) {
        console.error("❌ Erreur ajout mot :", error);
        alert("Erreur lors de l'ajout du mot (voir console)");
      }
    });

    /* =============================
       Chargement initial
       ============================= */
    document.addEventListener("DOMContentLoaded", () => {
      chargerMots();
    });
  </script>

</body>
</html>
